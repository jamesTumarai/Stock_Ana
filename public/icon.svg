<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#0a0a0f"/>
  <defs>
    <linearGradient id="spark-1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <linearGradient id="spark-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Main large spark -->
  <path d="M 50,15 C 50,35 65,50 85,50 C 65,50 50,65 50,85 C 50,65 35,50 15,50 C 35,50 50,35 50,15 Z" fill="url(#spark-1)" opacity="0.9" />
  
  <!-- Secondary angled spark -->
  <path d="M 50,25 C 50,40 60,50 75,50 C 60,50 50,60 50,75 C 50,60 40,50 25,50 C 40,50 50,40 50,25 Z" fill="url(#spark-2)" opacity="0.8" transform="rotate(45, 50, 50)" style="mix-blend-mode: screen" />

  <!-- Crisp White Core Layers -->
  <path d="M 50,20 C 50,38 62,50 80,50 C 62,50 50,62 50,80 C 50,62 38,50 20,50 C 38,50 50,38 50,20 Z" fill="#ffffff" opacity="0.5" />
  <path d="M 50,30 C 50,42 58,50 70,50 C 58,50 50,58 50,70 C 50,58 42,50 30,50 C 42,50 50,42 50,30 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Central bright spot -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
</svg>
