name: Apply Phase 3M DCF Source UI

on:
  push:
    branches:
      - phase3m-dcf-source-transparency
    paths:
      - .github/workflows/apply-phase3m-source-ui.yml

permissions:
  contents: write

jobs:
  patch-source-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3m-dcf-source-transparency
          fetch-depth: 0
      - name: Add DCF source transparency to intrinsic value UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/IntrinsicValueEngine.tsx')
          text = path.read_text()

          import_anchor = "import { calculateStrictDCFValue } from '../utils/valuation/dcfMathEngine';\n"
          import_line = "import { describeDcfFinancialSource } from '../utils/valuation/dcfSourceDescriptor';\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('DCF import anchor mismatch')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          descriptor_anchor = "  if (data.dcf_model.inputs?.isValid === false) {\n"
          descriptor_block = "  const dcfSource = describeDcfFinancialSource(data.dcf_model.inputs);\n  const dcfSourceLabel = isThai ? dcfSource.labelTh : dcfSource.labelEn;\n  const dcfSourceDetail = isThai ? dcfSource.detailTh : dcfSource.detailEn;\n  const dcfSourceMeta = [\n    dcfSource.sourcePeriod ? `${isThai ? 'งวด' : 'Period'}: ${dcfSource.sourcePeriod}` : null,\n    dcfSource.financialDataAsOf ? `${isThai ? 'งบ ณ' : 'Financials as of'}: ${dcfSource.financialDataAsOf}` : null,\n    dcfSource.sharesAsOf ? `${isThai ? 'หุ้นคงค้าง ณ' : 'Shares as of'}: ${dcfSource.sharesAsOf}` : null,\n  ].filter(Boolean).join(' • ');\n  const dcfSourceBadge = (\n    <div className={`flex items-start gap-2 rounded-xl border px-3 py-2.5 ${dcfSource.kind === 'sec_verified' ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-amber-50 border-amber-200 text-amber-950'}`}>\n      {dcfSource.kind === 'sec_verified'\n        ? <ShieldCheck className=\"w-4 h-4 mt-0.5 shrink-0 text-emerald-700\" />\n        : <Info className=\"w-4 h-4 mt-0.5 shrink-0 text-amber-700\" />}\n      <div className=\"min-w-0\">\n        <div className=\"text-xs font-bold\">{dcfSourceLabel}</div>\n        <div className=\"text-[11px] mt-0.5 leading-relaxed opacity-80\">{dcfSourceDetail}</div>\n        {dcfSourceMeta && <div className=\"text-[10px] mt-1 font-mono opacity-70\">{dcfSourceMeta}</div>}\n      </div>\n    </div>\n  );\n\n  if (data.dcf_model.inputs?.isValid === false) {\n"
          if "const dcfSource = describeDcfFinancialSource" not in text:
              if text.count(descriptor_anchor) != 1:
                  raise SystemExit('descriptor anchor mismatch')
              text = text.replace(descriptor_anchor, descriptor_block, 1)

          missing_anchor = "            {missing && <p className=\"text-xs mt-2 font-mono opacity-80\">{missing}</p>}\n"
          missing_replacement = missing_anchor + "            <div className=\"mt-3\">{dcfSourceBadge}</div>\n"
          if "<div className=\"mt-3\">{dcfSourceBadge}</div>" not in text:
              if text.count(missing_anchor) != 1:
                  raise SystemExit('invalid-card source anchor mismatch')
              text = text.replace(missing_anchor, missing_replacement, 1)

          valid_anchor = "          {(modelSelector?.reason_th || modelSelector?.reason_en) && (\n"
          valid_replacement = "          {dcfSourceBadge}\n          {(modelSelector?.reason_th || modelSelector?.reason_en) && (\n"
          if text.count("{dcfSourceBadge}") < 2:
              if text.count(valid_anchor) != 1:
                  raise SystemExit('valid-card source anchor mismatch')
              text = text.replace(valid_anchor, valid_replacement, 1)

          path.write_text(text)
          PY
      - name: Commit source UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/IntrinsicValueEngine.tsx; then
            echo "Source UI already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/IntrinsicValueEngine.tsx
          git commit -m "feat: show DCF financial data source in valuation UI"
          git push origin HEAD:phase3m-dcf-source-transparency
