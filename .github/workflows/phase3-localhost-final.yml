name: Phase 3 Final Localhost Acceptance

on:
  push:
    branches:
      - phase3-localhost-final-acceptance

permissions:
  contents: read

jobs:
  localhost-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: |
          npm run lint
          npm run build
      - name: Start final main on localhost
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 NODE_ENV=production npm start > /tmp/lumina-local.log 2>&1 &
          echo $! > /tmp/lumina-local.pid
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/index.html; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          grep -q '<!doctype html>' /tmp/index.html || grep -qi '<html' /tmp/index.html
          echo 'LOCAL_UI=200'
          status=$(curl -sS -o /tmp/tts.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/tts)
          test "$status" = "400"
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/tts.json','utf8')); if(!String(b.error||'').includes('Missing text')) process.exit(2); console.log('LOCAL_API_TTS_EMPTY=400');"
          tail -n 30 /tmp/lumina-local.log
      - name: Run Phase 3S model-fit and SEC classification guards
        run: |
          node --import tsx src/utils/valuation/__tests__/financialSectorDcfGuard.test.ts
          node --import tsx src/services/sec/secInvestmentClassificationGuard.test.ts
          node --import tsx src/utils/firestorePersistence.test.ts
      - name: Validate real MSFT report with final-main deterministic client and History round-trip
        shell: bash
        run: |
          cat > .phase3-final-localhost.mts <<'TS'
          import { fetchSecVerificationEnvelope } from './src/services/secVerificationService.ts';
          import { fetchLiveQuotes } from './src/services/marketDataService.ts';
          import { fetchDcfAssumptionProposal } from './src/services/dcfAssumptionService.ts';
          import { attachDcfAssumptionModel, hasValidDcfAssumptionModel } from './src/utils/valuation/dcfAssumptionProposal.ts';
          import { sanitizeUndefinedForPersistence } from './src/utils/firestorePersistence.ts';
          import {
            CURRENT_GENERATED_BY_VERSION,
            CURRENT_REPORT_SCHEMA_VERSION,
            isLegacyHistoryReport,
            validateAndPrepareReport,
          } from './src/utils/reportValidation.ts';

          const BACKEND='https://stock-ana-ten.vercel.app';
          (globalThis as any).window=globalThis;
          const nativeFetch=globalThis.fetch.bind(globalThis);
          globalThis.fetch=((input:any,init?:any)=>typeof input==='string'&&input.startsWith('/')?nativeFetch(new URL(input,BACKEND),init):nativeFetch(input,init)) as typeof fetch;

          function parseFinalText(text:string){
            const matches=[...text.matchAll(/```(?:json)?\s*([\s\S]*?)\s*```/g)];
            for(let i=matches.length-1;i>=0;i--){try{const p=JSON.parse(matches[i][1]);if(p&&typeof p==='object'&&!Array.isArray(p))return p}catch{}}
            const first=text.indexOf('{'); const last=text.lastIndexOf('}');
            if(first>=0&&last>first){try{const p=JSON.parse(text.slice(first,last+1));if(p&&typeof p==='object'&&!Array.isArray(p))return p}catch{}}
            return null;
          }

          function findUndefined(value:any,path='root',out:string[]=[]):string[]{
            if(value===undefined){out.push(path);return out;}
            if(Array.isArray(value)){value.forEach((v,i)=>findUndefined(v,`${path}[${i}]`,out));return out;}
            if(value&&typeof value==='object'){for(const [k,v] of Object.entries(value))findUndefined(v,`${path}.${k}`,out);}
            return out;
          }

          async function analyzeFundamental(){
            const c=new AbortController(); const timer=setTimeout(()=>c.abort(),285000);
            try{
              const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker:'MSFT',origin:BACKEND,model:'gemini-3.8-flash',language:'Thai',analysisType:'fundamental',useSelfConsistency:false}),signal:c.signal});
              const raw=await r.text(); let text=''; const counts:Record<string,number>={};
              for(const block of raw.split('\n\n')){const line=block.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const payload=line.slice(6);if(!payload||payload==='[DONE]')continue;try{const e=JSON.parse(payload);counts[e.type]=(counts[e.type]||0)+1;if(e.type==='text'&&e.text)text+=e.text}catch{}}
              console.log('SSE_COUNTS='+JSON.stringify(counts));
              return {status:r.status,finalData:parseFinalText(text)};
            } finally { clearTimeout(timer); }
          }

          const secP=fetchSecVerificationEnvelope('MSFT');
          const marketP=fetchLiveQuotes(['MSFT']);
          const result=await analyzeFundamental();
          if(result.status!==200||!result.finalData) throw new Error('MSFT Fundamental did not return parseable HTTP 200 report');
          const [sec,market]=await Promise.all([secP,marketP]);
          if(sec?.status!=='verified_eligible') throw new Error('MSFT SEC envelope is not verified_eligible');

          let report:any=result.finalData;
          if(!hasValidDcfAssumptionModel(report)){
            const proposal=await fetchDcfAssumptionProposal('MSFT',report,sec);
            if(proposal) report=attachDcfAssumptionModel(report,proposal);
          }

          const prepared=validateAndPrepareReport({...report,sec_verification:sec,analysis_type:'fundamental',ticker:'MSFT'},'MSFT',{marketQuotes:market?.quotes,requireMarketSnapshot:true});
          if(!prepared.report||!prepared.canPersist) throw new Error('Final-main MSFT report is not persistable');
          const preparedReport:any=prepared.report;
          const inputs=preparedReport?.intrinsic_value?.dcf_model?.inputs;
          const dcf=preparedReport?.intrinsic_value?.dcf_model;
          if(inputs?.financialDataSource!=='sec_verified') throw new Error('DCF financialDataSource is not sec_verified');
          if(inputs?.priceSource!=='market_snapshot') throw new Error('DCF priceSource is not market_snapshot');
          if(inputs?.isValid!==true) throw new Error('Deterministic DCF is invalid');
          if(!Number.isFinite(dcf?.scenarios?.bear?.fair_value_per_share)||!Number.isFinite(dcf?.scenarios?.base?.fair_value_per_share)||!Number.isFinite(dcf?.scenarios?.bull?.fair_value_per_share)) throw new Error('DCF scenarios are not finite');
          if(preparedReport?.report_provenance?.dcf_financial_inputs?.source!=='sec_verified') throw new Error('DCF provenance is not sec_verified');
          if(preparedReport?.report_provenance?.market_price?.source!=='market_snapshot') throw new Error('Market provenance is not market_snapshot');

          const persistedReport:any=sanitizeUndefinedForPersistence(preparedReport);
          const undefinedPaths=findUndefined(persistedReport);
          if(undefinedPaths.length) throw new Error('Firestore-unsafe undefined values remain: '+undefinedPaths.slice(0,20).join(','));

          const savePayload={
            userId:'phase3-localhost-acceptance',
            ticker:'MSFT',
            language:'Thai',
            createdAt:'2026-09-10T00:00:00.000Z',
            schemaVersion:preparedReport.schema_version??CURRENT_REPORT_SCHEMA_VERSION,
            generatedByVersion:preparedReport.generated_by_version??CURRENT_GENERATED_BY_VERSION,
            validationStatus:preparedReport.validation?.status??'warning',
            data:persistedReport,
          };
          const storedRecord:any=JSON.parse(JSON.stringify(savePayload));
          const historyData:any={...storedRecord.data,ticker:storedRecord.ticker};

          const checks={
            notLegacy:!isLegacyHistoryReport(storedRecord),
            schemaVersion:storedRecord.schemaVersion,
            generatedByVersion:storedRecord.generatedByVersion,
            secStatus:historyData?.sec_verification?.status??null,
            financialDataSource:historyData?.intrinsic_value?.dcf_model?.inputs?.financialDataSource??null,
            priceSource:historyData?.intrinsic_value?.dcf_model?.inputs?.priceSource??null,
            provenanceDcf:historyData?.report_provenance?.dcf_financial_inputs?.source??null,
            provenanceMarket:historyData?.report_provenance?.market_price?.source??null,
            baseFairValue:historyData?.intrinsic_value?.dcf_model?.scenarios?.base?.fair_value_per_share??null,
            secEnvelopeExact:JSON.stringify(persistedReport.sec_verification)===JSON.stringify(historyData.sec_verification),
            provenanceExact:JSON.stringify(persistedReport.report_provenance)===JSON.stringify(historyData.report_provenance),
            undefinedCount:undefinedPaths.length,
          };
          console.log('PHASE3_LOCALHOST_FINAL='+JSON.stringify(checks));
          const ok=checks.notLegacy===true&&checks.schemaVersion===CURRENT_REPORT_SCHEMA_VERSION&&checks.generatedByVersion===CURRENT_GENERATED_BY_VERSION&&checks.secStatus==='verified_eligible'&&checks.financialDataSource==='sec_verified'&&checks.priceSource==='market_snapshot'&&checks.provenanceDcf==='sec_verified'&&checks.provenanceMarket==='market_snapshot'&&Number.isFinite(checks.baseFairValue)&&checks.secEnvelopeExact===true&&checks.provenanceExact===true&&checks.undefinedCount===0;
          console.log('PHASE3_LOCALHOST_ACCEPTED='+ok);
          if(!ok) process.exitCode=2;
          TS
          node --import tsx .phase3-final-localhost.mts
      - name: Stop localhost server and show final logs
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lumina-local.pid ]; then kill "$(cat /tmp/lumina-local.pid)" || true; fi
          echo '--- localhost log ---'
          cat /tmp/lumina-local.log || true
