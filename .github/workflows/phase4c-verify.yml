name: Phase 4C Verify

on:
  push:
    branches:
      - phase4c-api-input-security

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply server hardening
        run: python scripts/phase4c_patch.py
      - name: Remove temporary scaffolding
        run: rm -f scripts/phase4c_patch.py .github/workflows/phase4c-verify.yml
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            node --import tsx "$file"
            echo "::endgroup::"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Security grep assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n "express.static(process.cwd())" server.ts
          ! grep -R -n "app.use('/run_logs'" server.ts
          ! grep -R -n "app.use('/latest_log'" server.ts
          ! grep -R -n "jsonlLogUrl: '/run_logs/'" server.ts
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'jamesTumarai'
          git config user.email 'jzuzu175@gmail.com'
          git add -A
          git commit -m 'fix: harden API input and transient file boundaries'
          git push origin HEAD:phase4c-api-input-security
