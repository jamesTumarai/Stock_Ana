name: Phase 3 Final Production Acceptance
on:
  push:
    branches:
      - phase3-final-acceptance
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run MSFT Fundamental + Technical acceptance
        shell: bash
        run: |
          cat > .phase3-final-acceptance.mts <<'TS'
          import { fetchSecVerificationEnvelope } from './src/services/secVerificationService.ts';
          import { fetchLiveQuotes } from './src/services/marketDataService.ts';
          import { fetchDcfAssumptionProposal } from './src/services/dcfAssumptionService.ts';
          import { attachDcfAssumptionModel, hasValidDcfAssumptionModel } from './src/utils/valuation/dcfAssumptionProposal.ts';
          import { validateAndPrepareReport } from './src/utils/reportValidation.ts';

          const BASE = 'https://stock-ana-ten.vercel.app';
          (globalThis as any).window = globalThis;
          const nativeFetch = globalThis.fetch.bind(globalThis);
          globalThis.fetch = ((input: any, init?: any) => {
            if (typeof input === 'string' && input.startsWith('/')) return nativeFetch(new URL(input, BASE), init);
            return nativeFetch(input, init);
          }) as typeof fetch;

          const parseFinalText = (text: string) => {
            const matches = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)\s*```/g)];
            for (let i = matches.length - 1; i >= 0; i -= 1) {
              try {
                const parsed = JSON.parse(matches[i][1]);
                if (parsed && (parsed.verdict || parsed.findings || parsed.deep_insights || parsed.investment_verdict)) return parsed;
              } catch {}
            }
            const first = text.indexOf('{');
            const last = text.lastIndexOf('}');
            if (first >= 0 && last > first) {
              try { return JSON.parse(text.slice(first, last + 1)); } catch {}
            }
            return null;
          };

          async function readAnalyze(analysisType: 'fundamental' | 'technical', useSelfConsistency = false) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 285_000);
            try {
              const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  ticker: 'MSFT',
                  origin: BASE,
                  model: 'gemini-3.8-flash',
                  language: 'Thai',
                  analysisType,
                  useSelfConsistency,
                }),
                signal: controller.signal,
              });
              if (!response.ok) throw new Error(`${analysisType} Analyze HTTP ${response.status}`);
              const raw = await response.text();
              let text = '';
              const counts: Record<string, number> = {};
              for (const block of raw.split('\n\n')) {
                const line = block.split('\n').find(item => item.startsWith('data: '));
                if (!line) continue;
                const payload = line.slice(6);
                if (!payload || payload === '[DONE]') continue;
                try {
                  const event = JSON.parse(payload);
                  counts[event.type] = (counts[event.type] || 0) + 1;
                  if (event.type === 'text' && event.text) text += event.text;
                } catch {}
              }
              return { status: response.status, counts, text, finalData: parseFinalText(text) };
            } finally {
              clearTimeout(timer);
            }
          }

          const secPromise = fetchSecVerificationEnvelope('MSFT');
          const marketPromise = fetchLiveQuotes(['MSFT']);
          const fundamental = await readAnalyze('fundamental', false);
          if (!fundamental.finalData) throw new Error('No parseable Fundamental report JSON');

          const [secVerification, marketResponse] = await Promise.all([secPromise, marketPromise]);
          let reportForValidation: any = fundamental.finalData;
          let proposalUsed = false;
          if (secVerification?.status === 'verified_eligible' && !hasValidDcfAssumptionModel(reportForValidation)) {
            const proposal = await fetchDcfAssumptionProposal('MSFT', reportForValidation, secVerification);
            if (proposal) {
              proposalUsed = true;
              reportForValidation = attachDcfAssumptionModel(reportForValidation, proposal);
            }
          }

          const prepared = validateAndPrepareReport(
            {
              ...reportForValidation,
              sec_verification: secVerification,
              analysis_type: 'fundamental',
              ticker: 'MSFT',
            },
            'MSFT',
            { marketQuotes: marketResponse?.quotes, requireMarketSnapshot: true },
          );
          const report: any = prepared.report;
          const inputs: any = report?.intrinsic_value?.dcf_model?.inputs;
          const dcf: any = report?.intrinsic_value?.dcf_model;
          const summary = {
            httpStatus: fundamental.status,
            streamCounts: fundamental.counts,
            proposalUsed,
            secStatus: secVerification?.status ?? null,
            secEligible: secVerification?.dcf_financial_inputs?.eligible ?? null,
            marketPrice: marketResponse?.quotes?.MSFT?.price ?? null,
            financialDataSource: inputs?.financialDataSource ?? null,
            priceSource: inputs?.priceSource ?? null,
            sourcePeriod: inputs?.sourcePeriod ?? null,
            isValid: inputs?.isValid ?? null,
            missingFields: inputs?.missingFields ?? null,
            waccPct: inputs?.waccPct ?? null,
            terminalGrowthPct: inputs?.terminalGrowthPct ?? null,
            projectionYears: inputs?.projectionYears ?? null,
            bearFairValue: dcf?.scenarios?.bear?.fair_value_per_share ?? null,
            baseFairValue: dcf?.scenarios?.base?.fair_value_per_share ?? null,
            bullFairValue: dcf?.scenarios?.bull?.fair_value_per_share ?? null,
            validationStatus: prepared.validation.status,
            criticalIssues: prepared.validation.issues.filter((issue: any) => issue.severity === 'critical').map((issue: any) => issue.code),
            canPersist: prepared.canPersist,
            provenanceMarket: report?.report_provenance?.market_price?.source ?? null,
            provenanceDcf: report?.report_provenance?.dcf_financial_inputs?.source ?? null,
          };
          console.log('FUNDAMENTAL_ACCEPTANCE=' + JSON.stringify(summary));

          const fundamentalAccepted =
            summary.httpStatus === 200 &&
            summary.secStatus === 'verified_eligible' &&
            summary.secEligible === true &&
            summary.financialDataSource === 'sec_verified' &&
            summary.priceSource === 'market_snapshot' &&
            summary.provenanceMarket === 'market_snapshot' &&
            summary.provenanceDcf === 'sec_verified' &&
            summary.isValid === true &&
            Array.isArray(summary.missingFields) && summary.missingFields.length === 0 &&
            Number.isFinite(summary.bearFairValue) &&
            Number.isFinite(summary.baseFairValue) &&
            Number.isFinite(summary.bullFairValue) &&
            summary.canPersist === true;
          console.log('FUNDAMENTAL_ACCEPTED=' + fundamentalAccepted);

          const technical = await readAnalyze('technical', false);
          const technicalSummary = {
            httpStatus: technical.status,
            streamCounts: technical.counts,
            parseable: Boolean(technical.finalData),
            intrinsicValue: technical.finalData?.intrinsic_value ?? null,
          };
          console.log('TECHNICAL_ACCEPTANCE=' + JSON.stringify(technicalSummary));
          const technicalAccepted = technical.status === 200 && Boolean(technical.finalData) && technical.finalData?.intrinsic_value == null;
          console.log('TECHNICAL_ACCEPTED=' + technicalAccepted);

          if (!fundamentalAccepted) process.exitCode = 2;
          if (!technicalAccepted) process.exitCode = 3;
          TS
          node --import tsx .phase3-final-acceptance.mts
