name: Verify Lumina

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firebase rules deployment preflight
        run: npm run firebase:rules:preflight -- --project stock-analyze-a89d0

      - name: Run regression tests
        run: node scripts/runRegressionTests.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Production build
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
