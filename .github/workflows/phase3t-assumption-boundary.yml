name: Apply Phase 3T Assumption Boundary
on:
  push:
    branches:
      - phase3t-assumption-boundary
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/phase3t-assumption-boundary.py
      - run: npm ci
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --import tsx "$file"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
          npm run lint
          npm run build
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          rm .github/workflows/phase3t-assumption-boundary.yml
          rm .github/scripts/phase3t-assumption-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: separate DCF assumptions from verified financial facts'
          git push origin HEAD:phase3t-assumption-boundary
