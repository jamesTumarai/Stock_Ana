name: Phase 4A Patch

on:
  push:
    branches:
      - phase4a-auth-boundary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/phase4a_patch.py
      - name: Remove temporary scaffolding
        run: rm -f scripts/phase4a_patch.py .github/workflows/phase4a-patch.yml .github/workflows/phase4a-route-audit.yml
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            node --import tsx "$file"
            echo "::endgroup::"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'jamesTumarai'
          git config user.email 'jzuzu175@gmail.com'
          git add -A
          git commit -m 'fix: enforce Firebase auth on protected AI routes'
          git push origin HEAD:phase4a-auth-boundary
