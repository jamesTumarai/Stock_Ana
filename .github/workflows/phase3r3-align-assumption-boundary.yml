name: Apply Phase 3R.3 Assumption Boundary Alignment
on:
  push:
    branches:
      - phase3r3-align-assumption-boundary
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align product boundary
        run: |
          python .github/scripts/phase3r3-align-assumption-boundary.py
          rm server/lib/valuationAssumptionBridge.ts
          rm src/utils/valuationAssumptionBridge.test.ts
      - run: npm ci
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx src/utils/dcfAssumptionBoundary.integration.test.ts
          node --import tsx src/utils/valuation/dcfAssumptionProposal.test.ts
          node --import tsx src/utils/serverPromptIntegrity.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit aligned product patch
        shell: bash
        run: |
          rm .github/workflows/phase3r3-align-assumption-boundary.yml
          rm .github/scripts/phase3r3-align-assumption-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align on verified DCF assumption boundary'
          git push origin HEAD:phase3r3-align-assumption-boundary
