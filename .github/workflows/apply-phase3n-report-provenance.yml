name: Apply Phase 3N Report Provenance

on:
  push:
    branches:
      - phase3n-report-provenance
    paths:
      - .github/workflows/apply-phase3n-report-provenance.yml

permissions:
  contents: write

jobs:
  patch-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3n-report-provenance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply report provenance patch
        run: python scripts/apply_phase3n.py

      - name: Install dependencies
        run: npm ci

      - name: Run provenance regression tests
        run: |
          node --import tsx src/utils/reportProvenance.test.ts
          node --import tsx src/utils/reportValidation.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit Phase 3N
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-phase3n-report-provenance.yml scripts/apply_phase3n.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/utils/reportValidation.ts src/utils/reportValidation.test.ts src/ReportTemplate.tsx
          git commit -m "feat: add report-level data provenance manifest"
          git push origin HEAD:phase3n-report-provenance
