name: Apply Phase 2 patch

on:
  push:
    branches:
      - phase2-runtime-validation

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[phase2-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .phase2/chunk.00 .phase2/chunk.01 .phase2/chunk.02 .phase2/chunk.03 .phase2/chunk.04 | tr -d '\r\n ' | base64 -d | gzip -dc > /tmp/phase2.patch
          echo "bbbb54bed2f8b191b500b6a0b6240d00f21fa088b4123dc9e90c26d9dc888b67  /tmp/phase2.patch" | sha256sum -c -
          git apply --check /tmp/phase2.patch

      - name: Apply patch and clean staging artifacts
        shell: bash
        run: |
          git apply /tmp/phase2.patch
          rm -rf .phase2
          rm -f .github/workflows/apply-phase2.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add runtime financial validation [phase2-applied]"
          git push origin HEAD:phase2-runtime-validation
