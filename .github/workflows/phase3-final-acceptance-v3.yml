name: Phase 3V History Round Trip Acceptance

on:
  push:
    branches:
      - phase3-final-acceptance-v3

permissions:
  contents: read

jobs:
  history-round-trip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production report save/load contract
        shell: bash
        run: |
          cat > .phase3v-history.mts <<'TS'
          import { fetchSecVerificationEnvelope } from './src/services/secVerificationService.ts';
          import { fetchLiveQuotes } from './src/services/marketDataService.ts';
          import { fetchDcfAssumptionProposal } from './src/services/dcfAssumptionService.ts';
          import { attachDcfAssumptionModel, hasValidDcfAssumptionModel } from './src/utils/valuation/dcfAssumptionProposal.ts';
          import {
            CURRENT_GENERATED_BY_VERSION,
            CURRENT_REPORT_SCHEMA_VERSION,
            isLegacyHistoryReport,
            validateAndPrepareReport,
          } from './src/utils/reportValidation.ts';

          const BASE='https://stock-ana-ten.vercel.app';
          (globalThis as any).window=globalThis;
          const nativeFetch=globalThis.fetch.bind(globalThis);
          globalThis.fetch=((input:any,init?:any)=>typeof input==='string'&&input.startsWith('/')?nativeFetch(new URL(input,BASE),init):nativeFetch(input,init)) as typeof fetch;

          function parseFinalText(text:string){
            const matches=[...text.matchAll(/```(?:json)?\s*([\s\S]*?)\s*```/g)];
            for(let i=matches.length-1;i>=0;i--){try{const p=JSON.parse(matches[i][1]);if(p&&typeof p==='object'&&!Array.isArray(p))return p}catch{}}
            const first=text.indexOf('{'); const last=text.lastIndexOf('}');
            if(first>=0&&last>first){try{const p=JSON.parse(text.slice(first,last+1));if(p&&typeof p==='object'&&!Array.isArray(p))return p}catch{}}
            return null;
          }

          function findUndefined(value:any,path='root',out:string[]=[]):string[]{
            if(value===undefined){out.push(path);return out;}
            if(Array.isArray(value)){value.forEach((v,i)=>findUndefined(v,`${path}[${i}]`,out));return out;}
            if(value&&typeof value==='object'){for(const [k,v] of Object.entries(value))findUndefined(v,`${path}.${k}`,out);}
            return out;
          }

          async function analyzeFundamental(){
            const c=new AbortController(); const timer=setTimeout(()=>c.abort(),285000);
            try{
              const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker:'MSFT',origin:BASE,model:'gemini-3.8-flash',language:'Thai',analysisType:'fundamental',useSelfConsistency:false}),signal:c.signal});
              const raw=await r.text(); let text=''; const counts:Record<string,number>={};
              for(const block of raw.split('\n\n')){const line=block.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const payload=line.slice(6);if(!payload||payload==='[DONE]')continue;try{const e=JSON.parse(payload);counts[e.type]=(counts[e.type]||0)+1;if(e.type==='text'&&e.text)text+=e.text}catch{}}
              return {status:r.status,counts,finalData:parseFinalText(text)};
            } finally { clearTimeout(timer); }
          }

          const secP=fetchSecVerificationEnvelope('MSFT');
          const marketP=fetchLiveQuotes(['MSFT']);
          const result=await analyzeFundamental();
          if(result.status!==200||!result.finalData) throw new Error('Fundamental Analyze did not return parseable HTTP 200 report');
          const [sec,market]=await Promise.all([secP,marketP]);
          let report:any=result.finalData;
          if(sec?.status==='verified_eligible'&&!hasValidDcfAssumptionModel(report)){
            const proposal=await fetchDcfAssumptionProposal('MSFT',report,sec);
            if(proposal) report=attachDcfAssumptionModel(report,proposal);
          }

          const prepared=validateAndPrepareReport({...report,sec_verification:sec,analysis_type:'fundamental',ticker:'MSFT'},'MSFT',{marketQuotes:market?.quotes,requireMarketSnapshot:true});
          if(!prepared.report||!prepared.canPersist) throw new Error('Prepared production report is not persistable');
          const preparedReport:any=prepared.report;
          const undefinedPaths=findUndefined(preparedReport);
          if(undefinedPaths.length) throw new Error('Firestore-unsafe undefined values: '+undefinedPaths.slice(0,20).join(','));

          // Mirrors saveReportToFirebase in App.tsx, excluding serverTimestamp implementation detail.
          const savePayload={
            userId:'phase3-acceptance-test-user',
            ticker:'MSFT',
            language:'Thai',
            createdAt:'2026-09-10T00:00:00.000Z',
            schemaVersion:preparedReport.schema_version??CURRENT_REPORT_SCHEMA_VERSION,
            generatedByVersion:preparedReport.generated_by_version??CURRENT_GENERATED_BY_VERSION,
            validationStatus:preparedReport.validation?.status??'warning',
            data:preparedReport,
          };

          // JSON wire round-trip is intentionally stricter than an in-memory spread: only plain persisted data survives.
          const storedRecord:any=JSON.parse(JSON.stringify(savePayload));
          // Mirrors HistoryModal onSelect hydration in App.tsx.
          const historyData:any={...storedRecord.data,ticker:storedRecord.ticker};

          const beforeInputs=preparedReport?.intrinsic_value?.dcf_model?.inputs;
          const afterInputs=historyData?.intrinsic_value?.dcf_model?.inputs;
          const beforeDcf=preparedReport?.intrinsic_value?.dcf_model;
          const afterDcf=historyData?.intrinsic_value?.dcf_model;
          const checks={
            notLegacy:!isLegacyHistoryReport(storedRecord),
            schemaVersion:storedRecord.schemaVersion,
            generatedByVersion:storedRecord.generatedByVersion,
            ticker:historyData.ticker,
            secStatus:historyData?.sec_verification?.status??null,
            secEligible:historyData?.sec_verification?.dcf_financial_inputs?.eligible??null,
            financialDataSource:afterInputs?.financialDataSource??null,
            priceSource:afterInputs?.priceSource??null,
            provenanceDcf:historyData?.report_provenance?.dcf_financial_inputs?.source??null,
            provenanceMarket:historyData?.report_provenance?.market_price?.source??null,
            sourcePeriodBefore:beforeInputs?.sourcePeriod??null,
            sourcePeriodAfter:afterInputs?.sourcePeriod??null,
            baseFairValueBefore:beforeDcf?.scenarios?.base?.fair_value_per_share??null,
            baseFairValueAfter:afterDcf?.scenarios?.base?.fair_value_per_share??null,
            validationStatusBefore:preparedReport?.validation?.status??null,
            validationStatusAfter:historyData?.validation?.status??null,
            secEnvelopeExact:JSON.stringify(preparedReport.sec_verification)===JSON.stringify(historyData.sec_verification),
            provenanceExact:JSON.stringify(preparedReport.report_provenance)===JSON.stringify(historyData.report_provenance),
            undefinedCount:undefinedPaths.length,
          };
          console.log('PHASE3V_HISTORY='+JSON.stringify(checks));

          const ok=
            checks.notLegacy===true&&
            checks.schemaVersion===CURRENT_REPORT_SCHEMA_VERSION&&
            checks.generatedByVersion===CURRENT_GENERATED_BY_VERSION&&
            checks.ticker==='MSFT'&&
            checks.secStatus==='verified_eligible'&&
            checks.secEligible===true&&
            checks.financialDataSource==='sec_verified'&&
            checks.priceSource==='market_snapshot'&&
            checks.provenanceDcf==='sec_verified'&&
            checks.provenanceMarket==='market_snapshot'&&
            checks.sourcePeriodBefore===checks.sourcePeriodAfter&&
            Number.isFinite(checks.baseFairValueBefore)&&
            checks.baseFairValueBefore===checks.baseFairValueAfter&&
            checks.validationStatusBefore===checks.validationStatusAfter&&
            checks.secEnvelopeExact===true&&
            checks.provenanceExact===true&&
            checks.undefinedCount===0;
          console.log('PHASE3V_HISTORY_ACCEPTED='+ok);
          if(!ok) process.exitCode=2;
          TS
          node --import tsx .phase3v-history.mts
