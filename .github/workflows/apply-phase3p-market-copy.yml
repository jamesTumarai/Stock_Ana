name: Apply Phase 3P Market Snapshot Copy

on:
  push:
    branches:
      - phase3p-market-snapshot-terminology
    paths:
      - .github/workflows/apply-phase3p-market-copy.yml

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3p-market-snapshot-terminology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply provider-snapshot terminology
        run: python scripts/apply_phase3p_market_copy.py
      - name: Guard against guaranteed-live UI claims
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE "Live Sync|Live Refresh|อัปเดตสด|ข้อมูลสดล่าสุด|ราคาตลาดสด|live market prices|live prices and market caps" src/ReportTemplate.tsx src/components/PeerComparisonTable.tsx; then
            echo "Overstated live-market copy remains"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit Phase 3P
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-phase3p-market-copy.yml scripts/apply_phase3p_market_copy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReportTemplate.tsx src/components/PeerComparisonTable.tsx
          git commit -m "refine: label provider market data as snapshots"
          git push origin HEAD:phase3p-market-snapshot-terminology
