name: Phase 4D1 Verify

on:
  push:
    branches:
      - phase4d-server-modularization

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply route extraction
        run: python scripts/phase4d1_patch.py
      - name: Remove temporary scaffolding
        run: rm -f scripts/phase4d1_patch.py .github/workflows/phase4d1-verify.yml
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            node --import tsx "$file"
            echo "::endgroup::"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Modularization assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'registerMarketRoutes(app);' server.ts
          grep -q '/api/live-quotes' server/routes/marketRoutes.ts
          grep -q '/api/dcf-assumptions' server/routes/dcfRoutes.ts
          grep -q '/api/analyze-metric' server/routes/metricRoutes.ts
          grep -q '/api/tts' server/routes/ttsRoutes.ts
          grep -q '/api/upload_artifact' server/routes/fileRoutes.ts
          ! grep -q 'app.get("/api/live-quotes"' server.ts
          ! grep -q 'app.post("/api/dcf-assumptions"' server.ts
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'jamesTumarai'
          git config user.email 'jzuzu175@gmail.com'
          git add -A
          git commit -m 'refactor: split non-analyze API routes from server entrypoint'
          git push origin HEAD:phase4d-server-modularization
