name: Apply Phase 3Q SEC Debt Reconciliation

on:
  push:
    branches:
      - phase3q-sec-debt-reconciliation
    paths:
      - .github/workflows/apply-phase3q-debt.yml

permissions:
  contents: write

jobs:
  patch-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3q-sec-debt-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply debt reconciliation patch
        run: python scripts/apply_phase3q_debt_reconciliation.py
      - name: Install dependencies
        run: npm ci
      - name: Run debt resolver regression tests
        run: npx tsx src/services/sec/secDebtResolver.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit Phase 3Q
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-phase3q-debt.yml scripts/apply_phase3q_debt_reconciliation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/sec/secDebtResolver.ts src/services/sec/secDebtResolver.test.ts
          git commit -m "fix: reconcile current SEC debt families without stale carry-forward"
          git push origin HEAD:phase3q-sec-debt-reconciliation
