name: Phase 3R.1 Production Acceptance
on:
  push:
    branches:
      - phase3r1-production-acceptance
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect MSFT fundamental valuation schema
        shell: bash
        run: |
          cat > .phase3r1-inspect.mjs <<'JS'
          const BASE = 'https://stock-ana-ten.vercel.app';
          const response = await fetch(`${BASE}/api/analyze`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ticker: 'MSFT',
              origin: BASE,
              model: 'gemini-3.8-flash',
              language: 'Thai',
              analysisType: 'fundamental',
              useSelfConsistency: false,
            }),
            signal: AbortSignal.timeout(285000),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const raw = await response.text();
          let text = '';
          for (const block of raw.split('\n\n')) {
            const line = block.split('\n').find(x => x.startsWith('data: '));
            if (!line) continue;
            const payload = line.slice(6);
            if (!payload || payload === '[DONE]') continue;
            try {
              const ev = JSON.parse(payload);
              if (ev.type === 'text' && ev.text) text += ev.text;
            } catch {}
          }
          const matches = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)\s*```/g)];
          let data = null;
          for (let i = matches.length - 1; i >= 0; i--) {
            try { data = JSON.parse(matches[i][1]); if (data) break; } catch {}
          }
          if (!data) throw new Error('No JSON');
          const vm = data.valuation_models ?? null;
          console.log('ROOT_KEYS=' + JSON.stringify(Object.keys(data)));
          console.log('VALUATION_MODELS=' + JSON.stringify(vm));
          console.log('INTRINSIC_VALUE=' + JSON.stringify(data.intrinsic_value ?? null));
          JS
          node .phase3r1-inspect.mjs
