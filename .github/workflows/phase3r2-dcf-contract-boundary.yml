name: Apply Phase 3R.2 DCF Contract Boundary
on:
  push:
    branches:
      - phase3r2-dcf-contract-boundary
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply product patch
        run: python .github/scripts/phase3r2-dcf-contract-boundary.py
      - run: npm ci
      - name: Verify bridge and regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx src/utils/valuationAssumptionBridge.test.ts
          node --import tsx src/utils/serverPromptIntegrity.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          rm .github/workflows/phase3r2-dcf-contract-boundary.yml
          rm .github/scripts/phase3r2-dcf-contract-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts server/lib/valuationAssumptionBridge.ts src/utils/valuationAssumptionBridge.test.ts src/utils/serverPromptIntegrity.test.ts .github/workflows/phase3r2-dcf-contract-boundary.yml .github/scripts/phase3r2-dcf-contract-boundary.py
          git commit -m 'fix: harden DCF contract boundary'
          git push origin HEAD:phase3r2-dcf-contract-boundary
