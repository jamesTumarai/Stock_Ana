name: Phase 4A Apply

on:
  push:
    branches:
      - phase4a-auth-boundary

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply and verify Phase 4A auth boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Phase 4A auth boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/auth src/services
          cat > server/auth/firebaseAuth.ts <<'TS'
          import type { RequestHandler } from 'express';
          import { getApps, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';

          const ADMIN_APP_NAME = 'lumina-server-auth';
          const DEFAULT_FIREBASE_PROJECT_ID = 'stock-analyze-a89d0';

          export interface VerifiedFirebaseIdentity {
            uid: string;
            email?: string;
          }

          export type FirebaseTokenVerifier = (idToken: string) => Promise<VerifiedFirebaseIdentity>;

          export function extractBearerToken(header: unknown): string | null {
            if (typeof header !== 'string') return null;
            const match = header.match(/^Bearer\s+([^\s]+)$/i);
            return match?.[1] ?? null;
          }

          function getFirebaseAdminApp() {
            const existing = getApps().find(app => app.name === ADMIN_APP_NAME);
            if (existing) return existing;
            return initializeApp(
              { projectId: process.env.FIREBASE_PROJECT_ID || DEFAULT_FIREBASE_PROJECT_ID },
              ADMIN_APP_NAME,
            );
          }

          export async function verifyFirebaseIdToken(idToken: string): Promise<VerifiedFirebaseIdentity> {
            const decoded = await getAuth(getFirebaseAdminApp()).verifyIdToken(idToken);
            return { uid: decoded.uid, email: decoded.email };
          }

          export function createRequireFirebaseAuth(
            verifier: FirebaseTokenVerifier = verifyFirebaseIdToken,
          ): RequestHandler {
            return async (req, res, next) => {
              const idToken = extractBearerToken(req.headers.authorization);
              if (!idToken) {
                res.status(401).json({ code: 'AUTH_REQUIRED', error: 'Authentication required.' });
                return;
              }

              try {
                const identity = await verifier(idToken);
                if (!identity?.uid) throw new Error('Token did not contain a uid.');
                res.locals.authUser = {
                  uid: identity.uid,
                  email: identity.email ?? null,
                };
                next();
              } catch {
                res.status(401).json({ code: 'AUTH_INVALID', error: 'Invalid or expired authentication token.' });
              }
            };
          }
          TS

          cat > src/services/authenticatedFetch.ts <<'TS'
          import { auth } from '../lib/firebase';

          export class AuthenticationRequiredError extends Error {
            code = 'AUTH_REQUIRED';

            constructor() {
              super('Please sign in to continue.');
              this.name = 'AuthenticationRequiredError';
            }
          }

          export async function authenticatedFetch(
            input: RequestInfo | URL,
            init: RequestInit = {},
          ): Promise<Response> {
            const currentUser = auth.currentUser;
            if (!currentUser) throw new AuthenticationRequiredError();

            const idToken = await currentUser.getIdToken();
            const inheritedHeaders = input instanceof Request ? input.headers : undefined;
            const headers = new Headers(init.headers ?? inheritedHeaders);
            headers.set('Authorization', `Bearer ${idToken}`);

            return fetch(input, { ...init, headers });
          }
          TS

          cat > src/utils/serverFirebaseAuth.test.ts <<'TS'
          import assert from 'node:assert/strict';
          import { createRequireFirebaseAuth, extractBearerToken } from '../../server/auth/firebaseAuth.ts';

          const makeResponse = () => {
            const res: any = { locals: {}, statusCode: 200, body: null };
            res.status = (statusCode: number) => { res.statusCode = statusCode; return res; };
            res.json = (body: unknown) => { res.body = body; return res; };
            return res;
          };

          assert.equal(extractBearerToken(undefined), null);
          assert.equal(extractBearerToken('Basic abc'), null);
          assert.equal(extractBearerToken('Bearer'), null);
          assert.equal(extractBearerToken('Bearer token-value'), 'token-value');
          assert.equal(extractBearerToken('bearer token-value'), 'token-value');

          {
            const middleware = createRequireFirebaseAuth(async () => ({ uid: 'unused' }));
            const req: any = { headers: {} };
            const res = makeResponse();
            let nextCalled = false;
            await middleware(req, res, () => { nextCalled = true; });
            assert.equal(res.statusCode, 401);
            assert.equal(res.body.code, 'AUTH_REQUIRED');
            assert.equal(nextCalled, false);
          }

          {
            const middleware = createRequireFirebaseAuth(async () => { throw new Error('invalid'); });
            const req: any = { headers: { authorization: 'Bearer invalid-token' } };
            const res = makeResponse();
            let nextCalled = false;
            await middleware(req, res, () => { nextCalled = true; });
            assert.equal(res.statusCode, 401);
            assert.equal(res.body.code, 'AUTH_INVALID');
            assert.equal(nextCalled, false);
          }

          {
            let verifiedToken = '';
            const middleware = createRequireFirebaseAuth(async token => {
              verifiedToken = token;
              return { uid: 'user-123', email: 'user@example.com' };
            });
            const req: any = { headers: { authorization: 'Bearer valid-token' } };
            const res = makeResponse();
            let nextCalled = false;
            await middleware(req, res, () => { nextCalled = true; });
            assert.equal(verifiedToken, 'valid-token');
            assert.equal(nextCalled, true);
            assert.deepEqual(res.locals.authUser, { uid: 'user-123', email: 'user@example.com' });
          }

          console.log('server Firebase auth middleware tests passed');
          TS

          cat > src/utils/phase4AuthBoundary.test.ts <<'TS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const server = fs.readFileSync('server.ts', 'utf8');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const dcf = fs.readFileSync('src/services/dcfAssumptionService.ts', 'utf8');
          const statements = fs.readFileSync('src/components/FinancialStatementsTable.tsx', 'utf8');

          for (const route of ['/api/tts', '/api/analyze-metric', '/api/dcf-assumptions', '/api/analyze']) {
            assert.ok(
              server.includes(`app.post("${route}", requireFirebaseAuth,`),
              `${route} must require verified Firebase auth`,
            );
          }

          assert.ok(app.includes("authenticatedFetch('/api/analyze'"), 'Analyze client call must send Firebase ID token');
          assert.ok(dcf.includes("authenticatedFetch('/api/dcf-assumptions'"), 'DCF assumption call must send Firebase ID token');
          assert.ok(statements.includes("authenticatedFetch('/api/analyze-metric'"), 'Metric insight call must send Firebase ID token');
          assert.ok(app.includes('if (!user) {'), 'Analyze UI must block unauthenticated execution before API work starts');

          console.log('Phase 4A auth boundary source checks passed');
          TS

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'server.ts',
              'import { validateDcfAssumptionModel } from "./src/utils/valuation/dcfAssumptionProposal.ts";\n',
              'import { validateDcfAssumptionModel } from "./src/utils/valuation/dcfAssumptionProposal.ts";\nimport { createRequireFirebaseAuth } from "./server/auth/firebaseAuth.ts";\n',
          )
          replace_once(
              'server.ts',
              '  const app = express();\n\n  app.use(express.json({ limit: \'50mb\' }));',
              '  const app = express();\n  const requireFirebaseAuth = createRequireFirebaseAuth();\n\n  app.use(express.json({ limit: \'50mb\' }));',
          )
          for route in ['/api/tts', '/api/analyze-metric', '/api/dcf-assumptions', '/api/analyze']:
              replace_once('server.ts', f'  app.post("{route}", async (req, res) => {{', f'  app.post("{route}", requireFirebaseAuth, async (req, res) => {{')

          replace_once(
              'src/App.tsx',
              "import { sanitizeUndefinedForPersistence } from './utils/firestorePersistence';\n",
              "import { sanitizeUndefinedForPersistence } from './utils/firestorePersistence';\nimport { authenticatedFetch } from './services/authenticatedFetch';\n",
          )
          replace_once('src/App.tsx', "      const resp = await fetch('/api/analyze', {", "      const resp = await authenticatedFetch('/api/analyze', {")
          replace_once(
              'src/App.tsx',
              "  const runAnalysis = () => {\n    if (!ticker.trim() || running) return;\n",
              "  const runAnalysis = () => {\n    if (!ticker.trim() || running) return;\n    if (!user) {\n      setError(selectedLanguage === 'Thai' ? 'กรุณาเข้าสู่ระบบก่อนเริ่มวิเคราะห์' : 'Please sign in before starting an analysis.');\n      return;\n    }\n",
          )

          replace_once(
              'src/services/dcfAssumptionService.ts',
              "import { validateDcfAssumptionModel } from '../utils/valuation/dcfAssumptionProposal';\n",
              "import { validateDcfAssumptionModel } from '../utils/valuation/dcfAssumptionProposal';\nimport { authenticatedFetch } from './authenticatedFetch';\n",
          )
          replace_once('src/services/dcfAssumptionService.ts', "    const response = await fetch('/api/dcf-assumptions', {", "    const response = await authenticatedFetch('/api/dcf-assumptions', {")

          replace_once(
              'src/components/FinancialStatementsTable.tsx',
              "import { getFinancialAiInsight, FinancialAiInsight } from '../utils/financialAiInsights';\n",
              "import { getFinancialAiInsight, FinancialAiInsight } from '../utils/financialAiInsights';\nimport { authenticatedFetch } from '../services/authenticatedFetch';\n",
          )
          replace_once('src/components/FinancialStatementsTable.tsx', "        const res = await fetch('/api/analyze-metric', {", "        const res = await authenticatedFetch('/api/analyze-metric', {")

          p = Path('.env.example')
          text = p.read_text()
          if 'FIREBASE_PROJECT_ID=' not in text:
              text += "\n# Public Firebase project identifier used by server-side ID-token verification.\nFIREBASE_PROJECT_ID=stock-analyze-a89d0\n"
              p.write_text(text)
          PY

          rm -f .github/workflows/phase4a-route-audit.yml .github/workflows/phase4a-apply.yml

      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            node --import tsx "$file"
            echo "::endgroup::"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Commit verified Phase 4A product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jamesTumarai'
          git config user.email 'jzuzu175@gmail.com'
          git add -A
          git status --short
          git commit -m 'fix: enforce Firebase auth on protected AI routes'
          git push origin HEAD:phase4a-auth-boundary
