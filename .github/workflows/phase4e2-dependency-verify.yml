name: Phase 4E2 Dependency Verify

on:
  push:
    branches:
      - phase4e2-dependency-remediation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-force audit remediation to lockfile only
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only
          status=$?
          set -e
          echo "npm audit fix exit status: $status (remaining non-critical findings are allowed at this stage)"

      - name: Assert package manifest is unchanged
        run: git diff --exit-code -- package.json

      - name: Install remediated lockfile
        run: npm ci

      - name: Assert high and critical production findings are cleared
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit.json
          set -e
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('production vulnerability counts after remediation:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            if (!['moderate', 'high', 'critical'].includes(item.severity)) continue;
            console.log(`${name}: severity=${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          if ((counts.high ?? 0) !== 0 || (counts.critical ?? 0) !== 0) process.exit(1);
          NODE
          rm -f /tmp/npm-audit.json

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            node --import tsx "$file"
            echo "::endgroup::"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Critical dependency gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Lockfile-only diff assertion
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git status --porcelain | awk '{print $2}')
          echo "$changed"
          test "$changed" = "package-lock.json"

      - name: Commit verified lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jamesTumarai"
          git config user.email "jzuzu175@gmail.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore: refresh transitive dependency lockfile [skip ci]"
          git push origin HEAD:phase4e2-dependency-remediation
