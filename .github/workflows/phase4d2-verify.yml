name: Phase 4D2 Verify

on:
  push:
    branches:
      - phase4d2-analyze-support-services

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply support extraction
        run: python scripts/phase4d2_patch.py
      - name: Remove temporary scaffolding
        run: rm -f scripts/phase4d2_patch.py .github/workflows/phase4d2-verify.yml
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            node --import tsx "$file"
            echo "::endgroup::"
          done < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Support extraction assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'loadAgentFiles } from "./server/lib/agentFiles.ts"' server.ts
          grep -q 'createInteractionWithRetry } from "./server/lib/agentRetry.ts"' server.ts
          ! grep -q '^function loadAgentFiles' server.ts
          ! grep -q '^async function createInteractionWithRetry' server.ts
          grep -q 'app.post("/api/analyze"' server.ts
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'jamesTumarai'
          git config user.email 'jzuzu175@gmail.com'
          git add -A
          git commit -m 'refactor: extract Analyze support services'
          git push origin HEAD:phase4d2-analyze-support-services
