name: Phase 3 Statement Shape Inspection

on:
  push:
    branches:
      - phase3-final-acceptance-v2

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect production MSFT statement series shapes
        shell: bash
        run: |
          cat > /tmp/phase3-shape.mjs <<'JS'
          const BASE = 'https://stock-ana-ten.vercel.app';
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 285000);
          try {
            const response = await fetch(BASE + '/api/analyze', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ticker: 'MSFT', origin: BASE, model: 'gemini-3.8-flash', language: 'Thai', analysisType: 'fundamental', useSelfConsistency: false }),
              signal: controller.signal,
            });
            const raw = await response.text();
            let text = '';
            for (const block of raw.split('\n\n')) {
              const line = block.split('\n').find(x => x.startsWith('data: '));
              if (!line) continue;
              try { const e = JSON.parse(line.slice(6)); if (e.type === 'text' && e.text) text += e.text; } catch {}
            }
            const matches = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)\s*```/g)];
            let report = null;
            for (let i = matches.length - 1; i >= 0; i--) {
              try { const p = JSON.parse(matches[i][1]); if (p && typeof p === 'object' && !Array.isArray(p)) { report = p; break; } } catch {}
            }
            if (!report) throw new Error('No parseable report JSON');
            const fs = report.financial_statements;
            const summarizeValue = (value) => {
              if (Array.isArray(value)) return { kind: 'array', length: value.length, preview: value.slice(0, 3) };
              if (value && typeof value === 'object') {
                const entries = Object.entries(value);
                return { kind: 'object', keys: entries.slice(0, 8).map(([k]) => k), preview: entries.slice(0, 3) };
              }
              return { kind: typeof value, value };
            };
            const summarizeSection = (section) => {
              if (!section || typeof section !== 'object' || Array.isArray(section)) return summarizeValue(section);
              return Object.fromEntries(Object.entries(section).map(([k, v]) => [k, summarizeValue(v)]));
            };
            console.log('STATEMENT_SHAPE=' + JSON.stringify({
              status: response.status,
              fsKeys: fs && typeof fs === 'object' && !Array.isArray(fs) ? Object.keys(fs) : [],
              periods: summarizeValue(fs?.periods),
              income_statement: summarizeSection(fs?.income_statement),
              balance_sheet: summarizeSection(fs?.balance_sheet),
              cash_flow: summarizeSection(fs?.cash_flow),
              cash_flow_statement: summarizeSection(fs?.cash_flow_statement),
            }));
          } finally { clearTimeout(timer); }
          JS
          node /tmp/phase3-shape.mjs
