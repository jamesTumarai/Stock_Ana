name: Apply Phase 3R.1 SSE parser fix

on:
  push:
    branches:
      - phase3r1-stream-sse-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify baseline and apply narrow patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object server/lib/agentClient.ts)" = "bb6d8c63afee2a1bc0bdea12195b69928591c3aa"
          python - <<'PY'
          from pathlib import Path

          path = Path('server/lib/agentClient.ts')
          text = path.read_text()
          replacements = {
              "import fs from 'fs';\n": "",
              "      fs.appendFileSync('debug_delta.log', 'TOOL RESULT DELTA: ' + JSON.stringify(delta) + '\\n');\n": "",
              "      fs.appendFileSync('debug_delta.log', 'TOOL CALL DELTA: ' + JSON.stringify(delta) + '\\n');\n": "",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          cat > src/utils/agentClientStream.test.ts <<'TS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { streamInteraction } from '../../server/lib/agentClient';

          console.log('Running managed-agent SSE stream checks...');

          const debugLogPath = path.resolve('debug_delta.log');
          if (fs.existsSync(debugLogPath)) fs.unlinkSync(debugLogPath);

          const payloads = [
            {
              event_type: 'step.delta',
              delta: {
                name: 'google_search',
                arguments: { query: 'MSFT 10-Q' },
                call_id: 'call_1',
              },
            },
            {
              event_type: 'step.delta',
              delta: {
                result: { ok: true },
                call_id: 'call_1',
              },
            },
          ];

          const sse = payloads.map(payload => `data: ${JSON.stringify(payload)}\n`).join('') + 'data: [DONE]\n';
          const response = new Response(sse, {
            status: 200,
            headers: { 'Content-Type': 'text/event-stream' },
          });

          const events = [];
          for await (const event of streamInteraction(response)) events.push(event);

          assert.deepEqual(events.map(event => event.type), ['tool_call', 'tool_result', 'done']);
          assert.equal(events[0]?.callId, 'call_1');
          assert.equal(events[1]?.callId, 'call_1');
          assert.equal(events[0]?.name, 'google_search');
          assert.deepEqual(events[0]?.arguments, { query: 'MSFT 10-Q' });
          assert.equal(events[1]?.result, JSON.stringify({ ok: true }));
          assert.equal(fs.existsSync(debugLogPath), false, 'stream parsing must not write debug_delta.log');

          console.log('Managed-agent SSE stream checks passed');
          TS

      - name: Install dependencies
        run: npm ci

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx src/utils/agentClientStream.test.ts
          npm run lint
          npm run build
          git diff --check
          ! grep -R "debug_delta.log" -n server/lib/agentClient.ts

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase3r1-stream-sse-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/lib/agentClient.ts src/utils/agentClientStream.test.ts
          git commit -m "fix: preserve managed-agent SSE events on Vercel"
          git push origin HEAD:phase3r1-stream-sse-fix
