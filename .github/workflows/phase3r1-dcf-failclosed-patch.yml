name: Apply Phase 3R.1 DCF assumption fail-closed fix
on:
  push:
    branches: [phase3r1-dcf-assumption-failclosed]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3r1-dcf-assumption-failclosed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow DCF null-safety patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/utils/valuation/dcfMathEngine.ts')
          text = engine.read_text()
          replacements = {
              "const rawWacc = userWacc ?? original?.assumptions.wacc_pct;": "const rawWacc = userWacc ?? original?.assumptions?.wacc_pct;",
              "const rawTerminalGrowth = userGrowth ?? original?.assumptions.terminal_growth_pct;": "const rawTerminalGrowth = userGrowth ?? original?.assumptions?.terminal_growth_pct;",
              "const rawProjectionYears = original?.assumptions.projection_years;": "const rawProjectionYears = original?.assumptions?.projection_years;",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          engine.write_text(text)

          test = Path('src/utils/reportValidation.test.ts')
          test_text = test.read_text()
          marker = "\n{\n  const invalidGrowth: any = makeValidReport();"
          if test_text.count(marker) != 1:
              raise SystemExit('Could not locate regression insertion marker')
          regression = r'''
{
  const missingDcfAssumptions: any = makeValidReport();
  delete missingDcfAssumptions.intrinsic_value.dcf_model.assumptions;
  const prepared = validateAndPrepareReport(missingDcfAssumptions, 'TEST');
  const inputs = prepared.report?.intrinsic_value?.dcf_model?.inputs;
  assert.ok(prepared.report, 'Missing DCF assumptions must fail closed instead of throwing');
  assert.equal(inputs?.isValid, false);
  assert.ok(inputs?.missingFields?.includes('discount rate (WACC)'));
  assert.ok(inputs?.missingFields?.includes('terminal growth rate'));
  assert.ok(inputs?.missingFields?.includes('projection years'));
  assert.equal(prepared.report?.intrinsic_value?.summary.base_case_fair_value, null);
}

'''
          test.write_text(test_text.replace(marker, '\n' + regression + marker.lstrip('\n'), 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify patch
        shell: bash
        run: |
          node --import tsx src/utils/reportValidation.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/phase3r1-dcf-failclosed-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/valuation/dcfMathEngine.ts src/utils/reportValidation.test.ts .github/workflows/phase3r1-dcf-failclosed-patch.yml
          git commit -m "fix: fail closed when DCF assumptions are missing"
          git push origin HEAD:phase3r1-dcf-assumption-failclosed
