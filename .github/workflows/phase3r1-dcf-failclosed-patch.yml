name: Apply DCF fail-closed fix
on:
  push:
    branches:
      - phase3r1-dcf-assumption-failclosed
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3r1-dcf-assumption-failclosed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch null safety and regression
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'original?.assumptions.wacc_pct' src/utils/valuation/dcfMathEngine.ts
          grep -Fq 'original?.assumptions.terminal_growth_pct' src/utils/valuation/dcfMathEngine.ts
          grep -Fq 'original?.assumptions.projection_years' src/utils/valuation/dcfMathEngine.ts
          sed -i 's/original?.assumptions.wacc_pct/original?.assumptions?.wacc_pct/' src/utils/valuation/dcfMathEngine.ts
          sed -i 's/original?.assumptions.terminal_growth_pct/original?.assumptions?.terminal_growth_pct/' src/utils/valuation/dcfMathEngine.ts
          sed -i 's/original?.assumptions.projection_years/original?.assumptions?.projection_years/' src/utils/valuation/dcfMathEngine.ts
          cat >> src/utils/reportValidation.test.ts <<'TS'

          {
            const missingDcfAssumptions: any = makeValidReport();
            delete missingDcfAssumptions.intrinsic_value.dcf_model.assumptions;
            const prepared = validateAndPrepareReport(missingDcfAssumptions, 'TEST');
            const inputs = prepared.report?.intrinsic_value?.dcf_model?.inputs;
            assert.ok(prepared.report, 'Missing DCF assumptions must fail closed instead of throwing');
            assert.equal(inputs?.isValid, false);
            assert.ok(inputs?.missingFields?.includes('discount rate (WACC)'));
            assert.ok(inputs?.missingFields?.includes('terminal growth rate'));
            assert.ok(inputs?.missingFields?.includes('projection years'));
            assert.equal(prepared.report?.intrinsic_value?.summary.base_case_fair_value, null);
          }
          TS
      - run: npm ci
      - name: Verify
        shell: bash
        run: |
          node --import tsx src/utils/reportValidation.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          rm .github/workflows/phase3r1-dcf-failclosed-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/valuation/dcfMathEngine.ts src/utils/reportValidation.test.ts .github/workflows/phase3r1-dcf-failclosed-patch.yml
          git commit -m 'fix: fail closed when DCF assumptions are missing'
          git push origin HEAD:phase3r1-dcf-assumption-failclosed
